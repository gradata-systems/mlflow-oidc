# Credentials for the production example, as chart values. Copy this file to
# secrets.yaml, fill it in, and encrypt it (e.g. SOPS with the helm-secrets
# plugin) or keep it out of Git. The chart writes these into its Secret
# `mlflow-oidc`; none of them appear in the Deployment or ConfigMap.

# MLflow tracking database. Read by mlflow.mlflow.backendStoreUriFrom in
# values.yaml.
backendStoreUri: postgresql://mlflow:CHANGE_ME@postgres.example.internal:5432/mlflow

oidc:
  # From the confidential client registered with the IdP.
  clientSecret: CHANGE_ME
  # Users, groups, permissions and sessions. A separate database from the
  # tracking one; it can be on the same server.
  usersDbUri: postgresql://mlflow_auth:CHANGE_ME@postgres.example.internal:5432/mlflow_auth
  cache:
    # Setting this also switches the permission cache to Redis.
    redisUrl: rediss://:CHANGE_ME@redis.example.internal:6379/0

  secret:
    # Signs session cookies. Set it here rather than letting the chart
    # generate one, so GitOps tools that render without cluster access don't
    # rotate it (and log everyone out) on every sync. Generate with:
    #   python -c "import secrets; print(secrets.token_urlsafe(48))"
    secretKey: CHANGE_ME
    # Encrypts the IdP tokens stored with each session, independently of
    # secretKey, so secretKey can be rotated without invalidating them.
    # Generate with:
    #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
    sessionTokenEncryptionKey: CHANGE_ME
